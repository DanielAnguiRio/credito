<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulador de Crédito</title>
    <link rel="stylesheet" href="simulador.css">
    <script src="funciones.js"></script>
    <script src="utilitarios.js"></script>
</head>
<body>

    <div class="fondo"></div>

    <div class="container">

        <!-- HEADER -->
        <div class="header">
            <img src="https://cdn-icons-png.flaticon.com/512/2830/2830284.png" class="logo">
            <h1>Simulador de Crédito</h1>
            <p class="sub">Análisis financiero inteligente</p>
        </div>

        <!-- DATOS -->
        <div class="card">
            <h2>Datos financieros</h2>

            <label>Ingresos</label>
            <input type="text" id="txtIngresos">
            <span id="errIngresos" class="error-msg"></span>

            <label>Egresos</label>
            <input type="text" id="txtEgresos">
            <span id="errEgresos" class="error-msg"></span>

            <div class="resultado">
                <p>Disponible <span id="spnDisponible"></span></p>
                <p>Capacidad mensual <span id="spnCapacidadPago"></span></p>
            </div>
        </div>

        <!-- CRÉDITO -->
        <div class="card">
            <h2>Solicitud</h2>

            <label>Monto</label>
            <input type="text" id="txtMonto">
            <span id="errMonto" class="error-msg"></span>

            <label>Plazo (años)</label>
            <input type="text" id="txtPlazo">
            <span id="errPlazo" class="error-msg"></span>

            <label>Tasa (%)</label>
            <input type="text" id="txtTasaInteres">
            <span id="errTasa" class="error-msg"></span>

            <div class="resultado">
                <p>Interés <span id="spnInteresPagar"></span></p>
                <p>Total <span id="spnTotalPrestamo"></span></p>
                <p>Cuota <span id="spnCuotaMensual"></span></p>
                <p class="estado">Estado <span id="spnEstadoCredito">ANALIZANDO...</span></p>
            </div>
        </div>

        <!-- BOTONES -->
        <div class="buttons">
            <button id="btnCalcularCredito" onclick="calcular()">Calcular</button>
            <button id="btnReiniciar">Reiniciar</button>
        </div>

    </div>

    <script src="simulador.js"></script>
</body>
</html>
